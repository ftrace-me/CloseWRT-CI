#CI项目
name: JDCloud RE-SP-01A Classic (18.06) 固件编译

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

#CI权限
permissions: write-all

#CI任务
jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Delete old Releases (MT7621 Classic only)
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          RELEASES=$(gh release list --repo ${{github.repository}} --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("MT7621-Classic-")) | .tagName')
          for TAG in $RELEASES; do
            echo "Deleting release: $TAG"
            gh release delete "$TAG" --repo ${{github.repository}} --yes --cleanup-tag || true
          done

      - name: Delete old Workflow Runs
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          RUNS=$(gh run list --workflow "${{github.workflow}}" --limit 100 --json databaseId --jq '.[] | .databaseId')
          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" != "${{github.run_id}}" ]; then
              echo "Deleting run: $RUN_ID"
              gh run delete "$RUN_ID" --repo ${{github.repository}} || true
            fi
          done

  config:
    needs: cleanup
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [MT7621-Classic]
        REPO_INFO:
          - {SOURCE: "padavanonly/immortalwrt", BRANCH: "master"}

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: OpenWrt
      #默认WIFI名称
      WRT_SSID: OpenWrt
      #默认WIFI密码
      WRT_WORD: ""
      #默认地址
      WRT_IP: 192.168.68.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.REPO_INFO.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.REPO_INFO.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.REPO_INFO.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
